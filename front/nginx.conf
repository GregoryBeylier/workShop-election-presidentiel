# HTTP : tout est redirigé vers HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS obligatoire : sans contexte sécurisé, les navigateurs mobiles refusent la caméra (scan du QR isoloir).
# Certificat auto-signé monté depuis ./certs (voir docker-compose.yml)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://back:8080;
        proxy_http_version 1.1;
        # $http_host garde le port éventuel : sinon Spring prend la requête pour du cross-origin (403 CORS)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
