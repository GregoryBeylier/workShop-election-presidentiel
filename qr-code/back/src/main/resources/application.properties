spring.application.name=checkin-api

# Prototype autonome : base H2 en mémoire, recréée à chaque démarrage à partir
# de schema.sql + data.sql. Pour Neon, voir ../sql/migration-postgres.sql
spring.datasource.url=jdbc:h2:mem:checkin;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Comme l'appli principale : le schéma est écrit à la main, Hibernate vérifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Joignable uniquement depuis ce PC : les téléphones passent par le proxy HTTPS du front,
# personne sur le Wi-Fi ne peut appeler l'API directement en HTTP non chiffré
server.address=127.0.0.1
