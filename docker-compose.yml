
services:
  postgres:
    image: postgres:16-alpine
    container_name: vote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vote_db
      POSTGRES_USER: vote_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  back:
    image: patrice1607/workshop-election-back
    container_name: vote-back
    restart: unless-stopped
    depends_on:
      - postgres
    # Même .env qu'en local (non versionné) : fournit JWT_SECRET.
    # Ses DB_* sont ignorés, les SPRING_DATASOURCE_* ci-dessous sont prioritaires.
    env_file:
      - ./back/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vote_db
      SPRING_DATASOURCE_USERNAME: vote_user
      SPRING_DATASOURCE_PASSWORD: change_me
      # Le front Docker est servi en HTTPS par nginx sur le Raspberry
      APP_CORS_ALLOWED_ORIGINS: https://192.168.50.1
    # Garder 8080 exposé : la borne ESP32 appelle l'API directement
    ports:
      - "8080:8080"

  front:
    image: patrice1607/workshop-election-front
    container_name: vote-front
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "80:80"
      - "443:443"
    # Certificat auto-signé généré sur le Pi (non versionné), voir README.md
    volumes:
      - ./certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
