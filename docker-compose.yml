
services:
  postgres:
    image: postgres:16-alpine
    container_name: vote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vote_db
      POSTGRES_USER: vote_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  back:
    build: ./back
    container_name: vote-back
    restart: unless-stopped
    depends_on:
      - postgres
    # Même .env qu'en local (non versionné) : fournit JWT_SECRET.
    # Ses DB_* sont ignorés, les SPRING_DATASOURCE_* ci-dessous sont prioritaires.
    env_file:
      - ./back/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vote_db
      SPRING_DATASOURCE_USERNAME: vote_user
      SPRING_DATASOURCE_PASSWORD: change_me
      # Le front Docker est servi sur 8081, pas sur le port Vite 5173
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"

  front:
    build:
      context: ./front
      args:
        # Le navigateur appelle l'API via nginx sur 8081, qui relaie vers back:8080
        VITE_API_URL: http://localhost:8081/api
    container_name: vote-front
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "8081:80"

volumes:
  postgres_data:
