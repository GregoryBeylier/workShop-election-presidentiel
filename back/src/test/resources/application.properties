# Configuration des tests : base H2 en mémoire, schéma généré depuis les entités.
# Remplace entièrement src/main/resources/application.properties pendant les tests.
spring.application.name=election-api

spring.datasource.url=jdbc:h2:mem:election-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=secret-de-test-uniquement-au-moins-32-caracteres
app.jwt.duree=2h
app.cors.allowed-origins=http://localhost:5173
