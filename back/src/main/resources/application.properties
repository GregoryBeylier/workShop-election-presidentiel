spring.application.name=election-api

# Secrets locaux (non versionnés) : back/.env, voir back/.env.example
spring.config.import=optional:file:.env[.properties]

# Base Neon (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le schéma est géré directement dans Neon : Hibernate vérifie seulement que les entités correspondent
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT : clé secrète dans .env, durée de validité du token
app.jwt.secret=${JWT_SECRET}
app.jwt.duree=2h

# Front autorisé à appeler l API (Vite)
app.cors.allowed-origins=http://localhost:5173
