spring.application.name=election-api

# Secrets locaux (non versionnés) : back/.env, voir back/.env.example
spring.config.import=optional:file:.env[.properties]

# Base Neon (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le schéma est géré directement dans Neon : Hibernate vérifie seulement que les entités correspondent
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Front autorisé à appeler l API (Next/Nuxt : 3000, Vite : 5173)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
